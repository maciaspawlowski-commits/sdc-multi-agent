apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: sdc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-sdc
rules:
  # k8sattributes processor — needs to look up pods by IP
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, endpoints, services, events, resourcequotas]
    verbs: [list, watch, get]
  # kubeletstats receiver — needs proxy access to each node's Kubelet API
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy, nodes/metrics]
    verbs: [get]
  # k8s_cluster receiver — cluster-level metrics
  - apiGroups: [""]
    resources: [replicationcontrollers]
    verbs: [list, watch, get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [list, watch, get]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch, get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-sdc
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: sdc
roleRef:
  kind: ClusterRole
  name: otel-collector-sdc
  apiGroup: rbac.authorization.k8s.io
